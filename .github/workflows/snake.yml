name: Generate Snake

on:

schedule:

- cron: "0 \*/12 \* \* \*"

workflow\_dispatch:

push:

branches:

- main

permissions:

contents: write

jobs:

generate:

runs-on: ubuntu-latest

timeout-minutes: 10

steps:

- name: Generate snake animation

uses: Platane/snk/svg-only@v3

with:

github\_user\_name: ${{ github.repository\_owner }}

outputs: |

dist/snake-dark.svg?palette=github-dark&color\_snake=#2DD4BF&color\_dots=#161B22,#0B3B3A,#0F766E,#14B8A6,#2DD4BF

dist/snake-light.svg?color\_snake=#0F766E&color\_dots=#EBEDF0,#99F6E4,#5EEAD4,#14B8A6,#0F766E

- name: Remove the progress bar under the snake

run: |

for f in dist/\*.svg; do

perl -pi -e 's/<rect class="u [^>]\*\/>//g; s/(viewBox="\S+ \S+ \S+ )(\d+)"( width="\d+" height=")(\d+)"/$1.($2-16)."\"".$3.($4-16)."\""/e' "$f"

done

- name: Push to the output branch

uses: crazy-max/ghaction-github-pages@v3.1.0

with:

target\_branch: output

build\_dir: dist

env:

GITHUB\_TOKEN: ${{ secrets.GITHUB\_TOKEN }}
